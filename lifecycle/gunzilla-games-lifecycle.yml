source: https://gunbygunz.com/documentation/
summary: >-
  Gunzilla runs production chain infrastructure with essentially no published API lifecycle posture:
  no status page, no deprecation policy, no SLA, no changelog for either the RPC or the explorer, and
  no versioning statement of its own. What versioning exists is inherited from the upstream projects
  (Ethereum JSON-RPC, Avalanche Subnet-EVM, Blockscout).
versioning:
  scheme: uri-path (explorer) / upstream-client (chain)
  current:
    gunzscan_rest: v2
    gunzscan_graphql: v1
    gunzscan_legacy: unversioned (?module=&action=)
    chain_client: v1.14.2
  chain_client_probe: 'POST web3_clientVersion -> {"result":"v1.14.2"}'
  docs: https://gunbygunz.com/documentation/
  note: >-
    The chain method surface is the Ethereum JSON-RPC contract plus Avalanche Subnet-EVM extensions;
    it is versioned upstream at https://docs.avax.network/api-reference/subnet-evm-api, not by
    Gunzilla.
deprecation:
  policy_url: null
  sunset_header: false
  deprecation_header: false
  note: >-
    No deprecation policy is published. The Etherscan-compatible /api?module=&action= surface is
    described in Blockscout's own Swagger UI as a transitional compatibility layer ("provided for
    developers transitioning their applications from Etherscan to BlockScout") but Gunzilla makes no
    statement about how long it will serve it.
sla:
  url: null
  uptime_target: null
  note: >-
    No SLA. The documentation instead makes an availability-adjacent commitment about finality -
    "waiting for 2-3 blocks to consider a transaction confirmed and irreversible is entirely
    sufficient" - with block times of ~1-2 seconds.
status_page: null
