- name: GUNZScan Explorer API
  description: 'GUNZScan is the GUNZ chain block explorer, referenced from Gunzilla''s
    own chain documentation as the official explorer. It runs Blockscout and exposes
    three anonymous, machine-readable read surfaces: a REST v2 JSON API under /api/v2
    (stats, blocks, transactions, addresses, tokens, smart contracts), an Etherscan-compatible
    module/action API under /api documented with a Swagger UI at /api-docs, and a GraphQL
    endpoint at /api/v1/graphql whose introspection is open. A Phoenix WebSocket at
    /socket/websocket carries the GraphQL token-transfer subscription.'
  humanURL: https://gunzscan.io/api-docs
  baseURL: https://gunzscan.io/api
