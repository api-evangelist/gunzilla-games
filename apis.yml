apis:
- name: GUNZ Chain JSON-RPC API
  description: 'The public Ethereum-compatible JSON-RPC endpoint for the GUNZ L1 chain,
    an Avalanche subnet running Subnet-EVM. It inherits the full EVM API surface of
    an Ethereum node (eth_*, net_*, web3_*), plus the Avalanche subnet-evm extensions.
    Chain ID 43419, native gas coin GUN (18 decimals), Snowman++ consensus, ~1-2 second
    blocks with finality in 2-3 blocks. The chain is permissioned for contract deployment
    and validation; the RPC itself answers anonymous reads, with IP allow-listing offered
    to partners to avoid rate limits.'
  humanURL: https://gunbygunz.com/documentation/
  baseURL: https://rpc.gunzchain.io/ext/bc/2M47TxWHGnhNtq6pM5zPXdATBtuqubxn5EPFgFmEawCQr9WFML/rpc
  tags:
