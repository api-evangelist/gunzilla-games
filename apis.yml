aid: gunzilla-games
name: Gunzilla Games
description: 'Gunzilla Games is a AAA game developer founded in 2020 with studios in
  Frankfurt, Kyiv and London, best known for the cyberpunk battle-royale shooter Off
  The Grid. Alongside the game the studio operates GUNZ, a permissioned Avalanche L1
  (subnet) blockchain purpose-built for game developers, with GUN as its native gas
  coin. The public technical surface is EVM-shaped: a public Ethereum/Subnet-EVM JSON-RPC
  node at rpc.gunzchain.io (chain ID 43419), a mirrored Avalanche-hosted RPC, and the
  GUNZScan block explorer at gunzscan.io, which exposes a Blockscout REST v2 API, an
  Etherscan-compatible module/action API, an open GraphQL endpoint and a WebSocket
  subscription surface. A gated marketplace/minting API sits behind api.gunztoken.io.'
