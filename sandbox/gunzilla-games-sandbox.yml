generated: '2026-08-04'
method: probed
source: https://gunbygunz.com/documentation/
summary: >-
  Gunzilla operates a GUNZ testnet alongside mainnet, but publishes no testing documentation, no
  faucet URL of its own, and no test-vs-live key conventions (there are no keys). Test funding is a
  human process: the documentation asks developers to send wallet addresses to the team, who fund
  them. The testnet chain ID was confirmed by probe, not by a docs page.
test_vs_live:
  mechanism: separate chain ID / separate RPC endpoint
  key_prefixes: null
  note: >-
    There are no API keys on any Gunzilla surface, so there is no test-key/live-key separation. A
    client targets test or live purely by which RPC URL and chain ID it signs for. EIP-155 makes this
    safe - a transaction signed for chain 49321 is not valid on chain 43419 and vice versa.
