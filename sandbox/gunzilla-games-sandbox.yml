test_funding:
  self_service_faucet: null
  mechanism: request funding from the Gunzilla team
  quote: >-
    "If you need native coins to cover gas fees, kindly provide us with your wallet addresses, and we
    will fund them for you."
  source: https://gunbygunz.com/documentation/
  channel: https://gunbygunz.com/develop/ (application form) or the GUNZ Discord
