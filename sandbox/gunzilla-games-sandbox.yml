tooling:
  wallet: MetaMask or any EVM wallet, by adding GUNZ as a custom network
  quote: >-
    "To quickly understand how the subnet is similar to EVM chains, you can manually interact with
    our subnet using MetaMask or a similar tool. To do this, add our chain as a custom network to
    your MetaMask."
  libraries: web3.js, ethers.js and standard Ethereum libraries (per the documentation)
  postman: >-
    Gunzilla points at the third-party Avalanche Postman collection
    (https://github.com/ava-labs/avalanche-postman-collection/) rather than publishing one of its own.
constraints:
- Contract deployment is permissioned on both environments - an unapproved address cannot deploy even
  with sufficient gas.
- Validator nodes are restricted to approved partners and Ava Labs nodes.
gaps:
- No published faucet, no self-service test funding, no documented testnet at all on Gunzilla's own
  site.
- No sandbox for the gated marketplace/minting API at api.gunztoken.io.
