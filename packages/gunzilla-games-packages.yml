summary: >-
  Gunzilla publishes no first-party client library on any public package registry. The GUNZ
  documentation explicitly tells developers to use the generic Ethereum tooling instead. Mobile
  wallet SDKs for iOS and Android are advertised on the developer page but are not publicly
  distributed - they are obtained by applying to launch on GUNZ. The only publicly downloadable
  first-party artefacts are the two consumer wallet apps in the mobile stores.
